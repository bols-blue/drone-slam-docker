# FAST-LIVO2 パラメータのベース (上流 config/avia.yaml / MARS_LVIG.yaml を Mid-360S + ドローン向けに調整)
# common / extrin_calib / time_offset / preprocess.blind / camera は gen_config.py が calib.yaml から上書きする。
# その他の値は calib.yaml の `fast_livo2:` セクションで個別に上書きできる (README 参照)。
common:
  img_topic: "/image_raw"
  lid_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  extrinsic_T: [0.0, 0.0, 0.0]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  Rcl: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  Pcl: [0.0, 0.0, 0.0]

time_offset:
  imu_time_offset: 0.0
  img_time_offset: 0.0
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 1        # 1 = Livox (livox_ros_driver/CustomMsg)。Mid-360S もこれ
  scan_line: 4         # calib.yaml の lidar.scan_lines で上書き (Mid-360S は 4 ライン)
  blind: 0.5

vio:
  max_iterations: 5
  outlier_threshold: 1000
  img_point_cov: 100
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true   # USB カメラは自動露光なので露光推定を有効にしておく
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5
  gyr_cov: 0.3
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: true   # 地図の Z 軸を重力方向に揃える (船体の上下が分かりやすくなる)

publish:
  dense_map_en: true
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "replay"
  pose_output_en: true     # Log/result/replay.txt に TUM 形式の軌跡を出力

pcd_save:
  pcd_save_en: true
  type: 0                  # 0: World Frame
  colmap_output_en: false  # true で Log/Colmap に COLMAP 形式 (画像+姿勢+点) を出力 (OpenMVS 等の後処理用)
  filter_size_pcd: 0.1    # map_rgb.pcd のボクセル [m]。小さすぎると広い地図で PCL がオーバーフローし間引かれない
  interval: -1             # -1: 全フレームを 1 ファイルに保存 (終了時)

image_save:
  img_save_en: false
  interval: 1

# ---- カメラ (laserMapping ノード名前空間に読み込まれる) ----
camera:
  cam_model: Pinhole
  scale: 0.5               # 処理解像度の倍率 (1280x720 -> 640x360 で処理)
