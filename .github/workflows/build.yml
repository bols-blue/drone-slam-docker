name: build-and-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      targets:
        description: "ビルドする対象 (カンマ区切り。空なら全部)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/drone-slam

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: tools,             dockerfile: tools/Dockerfile }
          - { tag: fast-livo2,        dockerfile: fast_livo2/Dockerfile }
          - { tag: fast-lio2-openmvs, dockerfile: fast_lio2_openmvs/Dockerfile }
          - { tag: r3live,            dockerfile: r3live/Dockerfile }
          - { tag: sr-livo,           dockerfile: sr_livo/Dockerfile }
          - { tag: lvi-sam,           dockerfile: lvi_sam/Dockerfile }
    steps:
      - name: Skip if not selected
        id: sel
        run: |
          t="${{ github.event.inputs.targets }}"
          if [ -z "$t" ] || echo ",$t," | grep -q ",${{ matrix.tag }},"; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - name: Free disk space
        if: steps.sel.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4
        if: steps.sel.outputs.run == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.sel.outputs.run == 'true'

      - uses: docker/login-action@v3
        if: steps.sel.outputs.run == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        if: steps.sel.outputs.run == 'true'
        id: meta
        run: |
          tags="${IMAGE}:${{ matrix.tag }},${IMAGE}:${{ matrix.tag }}-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags="$tags,${IMAGE}:${{ matrix.tag }}-${GITHUB_REF_NAME}"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        if: steps.sel.outputs.run == 'true'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: MAKE_JOBS=4
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,scope=${{ matrix.tag }},mode=max
